name: Browser acceptance
on:
  push:
    branches: [release/v1-comprehensive]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app and browser test dependencies
        run: |
          python -m pip install -e '.[dashboard]' playwright pypdf
          python -m playwright install --with-deps chromium
      - name: Browser acceptance against local release candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run dashboard.py --server.headless true --server.port 8765 --browser.gatherUsageStats false > /tmp/fragility-browser-server.log 2>&1 &
          streamlit_pid=$!
          trap 'kill "$streamlit_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8765/_stcore/health > /dev/null; then
              break
            fi
            sleep 1
          done
          python tests/browser_smoke.py || { cat /tmp/fragility-browser-server.log; exit 1; }
      - name: Upload browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-screenshot
          path: /tmp/fragility-browser-smoke.png
          if-no-files-found: ignore

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fragility-atlas"
version = "1.0.0rc1"
description = "Research platform for linear-factor portfolio stress, historical risk and counterfactual hedging"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
dashboard = ["streamlit>=1.35", "pandas>=2.0", "reportlab>=4.0"]

[project.scripts]
fragility-atlas = "fragility_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
